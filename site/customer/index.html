<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Ba Ba Bank</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
		<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
		<link href="../styles.css" rel="stylesheet">
	</head>
	<body data-page="customer" data-api-base="../backend">
		<div class="app-shell">
			<nav class="navbar sticky-top">
				<div class="container">
					<a class="navbar-brand d-flex align-items-center gap-2 fw-semibold" href="../">
						<span class="brand-mark"><i class="bi bi-bank"></i></span>
						<span>Ba Ba Bank</span>
					</a>
					<div id="customer-app-nav" class="is-hidden d-flex align-items-center gap-2">
						<span id="customer-name" class="d-none d-sm-inline text-secondary"></span>
						<button class="btn btn-outline-primary btn-sm" type="button" data-bs-toggle="modal" data-bs-target="#twint-modal">
							<i class="bi bi-send me-1"></i>Twint
						</button>
						<button id="logout-button" class="btn btn-outline-secondary btn-sm" type="button">
							<i class="bi bi-box-arrow-right me-1"></i>Abmelden
						</button>
					</div>
				</div>
			</nav>

			<main class="app-main">
				<section id="signed-out" class="container py-5 is-hidden">
					<div class="surface p-4 p-md-5 auth-panel mx-auto text-center">
						<div class="signed-out-icon mx-auto"><i class="bi bi-person-lock" aria-hidden="true"></i></div>
						<h1 class="h4 mt-3">Nicht angemeldet</h1>
						<p class="text-secondary">Bitte melde dich an, um dein Konto zu sehen.</p>
						<a class="btn btn-primary" href="../">
							<i class="bi bi-box-arrow-in-right me-1"></i>Anmelden
						</a>
					</div>
				</section>

				<section id="customer-app" class="container py-4 is-hidden">
					<div class="d-flex flex-column flex-md-row justify-content-between align-items-md-end gap-3 mb-4">
						<div>
							<div class="d-flex flex-wrap gap-2 mb-3">
								<span class="mini-badge"><i class="bi bi-wallet2" aria-hidden="true"></i>Mein Pocket</span>
								<span class="mini-badge"><i class="bi bi-stars" aria-hidden="true"></i>Level sparen</span>
							</div>
							<h1 class="h2 mb-0">Uebersicht</h1>
						</div>
					</div>

					<div class="row g-3 mb-4">
						<div class="col-lg-6">
							<div class="surface metric balance-hero p-4 p-md-5">
								<div class="d-flex justify-content-between align-items-start mb-3">
									<div class="metric-label">Vermoegen</div>
									<i class="bi bi-award text-secondary fs-3"></i>
								</div>
								<div class="metric-value"><span id="kpi-balance">0.00</span><small id="kpi-balance-sign" class="fs-4 text-secondary"></small></div>
								<div class="text-secondary mt-3">Dein aktueller Kontostand.</div>
							</div>
						</div>
						<div class="col-md-6 col-lg-3">
							<div class="surface metric savings-card p-4">
								<div class="d-flex justify-content-between align-items-start mb-3">
									<div class="metric-label">Sparen</div>
									<i class="bi bi-piggy-bank text-secondary fs-4"></i>
								</div>
								<div class="metric-value"><span id="kpi-pigs">0</span><small class="fs-5 text-secondary"> x 100</small></div>
								<div class="progress-pocket mt-3" aria-hidden="true"><div id="savings-progress" class="progress-pocket-bar"></div></div>
							</div>
						</div>
						<div class="col-md-6 col-lg-3">
							<div class="surface metric activity-card p-4">
								<div class="d-flex justify-content-between align-items-start mb-3">
									<div class="metric-label">Ein / Aus</div>
									<i class="bi bi-arrow-down-up text-secondary fs-4"></i>
								</div>
								<div class="metric-value"><span id="kpi-ins">0</span><small class="fs-5 text-secondary"> / <span id="kpi-outs">0</span></small></div>
							</div>
						</div>
					</div>

					<div class="accordion transaction-accordion" id="customer-transactions-accordion">
						<div class="accordion-item surface">
							<h2 class="accordion-header" id="customer-transactions-heading">
								<button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#customer-transactions-panel" aria-expanded="false" aria-controls="customer-transactions-panel">
									<span class="d-flex align-items-center gap-2">
										<i class="bi bi-receipt text-secondary fs-4" aria-hidden="true"></i>
										<span>Transaktionen</span>
									</span>
								</button>
							</h2>
							<div id="customer-transactions-panel" class="accordion-collapse collapse" aria-labelledby="customer-transactions-heading">
								<div class="accordion-body p-0">
									<div class="table-responsive">
										<table class="table table-striped mb-0">
											<thead>
												<tr>
													<th scope="col">
														<span class="sortable-header">Wann <button type="button" class="sort-button" data-sort-table="customer" data-sort-key="datetime" aria-label="Nach Wann sortieren"><i class="bi bi-arrow-down-up" aria-hidden="true"></i></button></span>
													</th>
													<th scope="col">
														<span class="sortable-header">Typ <button type="button" class="sort-button" data-sort-table="customer" data-sort-key="type" aria-label="Nach Typ sortieren"><i class="bi bi-arrow-down-up" aria-hidden="true"></i></button></span>
													</th>
													<th scope="col">
														<span class="sortable-header">Betrag <button type="button" class="sort-button" data-sort-table="customer" data-sort-key="amount" aria-label="Nach Betrag sortieren"><i class="bi bi-arrow-down-up" aria-hidden="true"></i></button></span>
													</th>
													<th scope="col">
														<span class="sortable-header">Saldo <button type="button" class="sort-button" data-sort-table="customer" data-sort-key="balance" aria-label="Nach Saldo sortieren"><i class="bi bi-arrow-down-up" aria-hidden="true"></i></button></span>
													</th>
												</tr>
											</thead>
											<tbody id="transactions-body"></tbody>
										</table>
									</div>
								</div>
							</div>
						</div>
					</div>
				</section>
			</main>
		</div>

		<div class="modal fade" id="twint-modal" tabindex="-1" aria-labelledby="twint-modal-label" aria-hidden="true">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header">
						<h1 class="modal-title fs-5" id="twint-modal-label"><i class="bi bi-send me-2"></i>Twint</h1>
						<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Schliessen"></button>
					</div>
					<div class="modal-body">
						<div class="form-floating">
							<input type="number" min="0.05" step="0.05" class="form-control" id="twint-amount" placeholder="10.50">
							<label for="twint-amount">Betrag</label>
						</div>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Schliessen</button>
						<a href="#" id="twint-link" class="btn btn-primary disabled" target="_blank" rel="noopener">
							<i class="bi bi-send me-1"></i>Twint
						</a>
					</div>
				</div>
			</div>
		</div>

		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
		<script src="../app.js"></script>
	</body>
</html>
