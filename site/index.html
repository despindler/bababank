<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Ba Ba Bank</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
		<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
		<link href="styles.css" rel="stylesheet">
	</head>
	<body data-page="home" data-api-base="backend">
		<div class="app-shell">
			<nav class="navbar sticky-top">
				<div class="container">
					<a class="navbar-brand d-flex align-items-center gap-2 fw-semibold" href="./">
						<span class="brand-mark"><i class="bi bi-bank"></i></span>
						<span>Ba Ba Bank</span>
					</a>
					<a class="btn btn-outline-primary btn-sm" href="boss/">
						<i class="bi bi-shield-lock me-1"></i>Boss
					</a>
				</div>
			</nav>

			<main class="app-main">
				<div class="container py-4 py-lg-5">
					<div class="row align-items-center g-4 g-lg-5">
						<section class="col-lg-6">
							<div class="d-flex flex-column gap-4">
								<div>
									<h1 class="display-5 fw-bold mb-3">Ba Ba Bank</h1>
									<p class="lead text-secondary mb-0">Familienbank fuer Taschengeld, Sparziele und Auszahlungen.</p>
								</div>
								<div id="signed-in-actions" class="surface p-3 is-hidden">
									<div class="d-flex flex-column flex-sm-row align-items-sm-center justify-content-between gap-3">
										<div>
											<div class="muted-label small">Angemeldet</div>
											<div id="signed-in-name" class="fw-semibold"></div>
										</div>
										<a class="btn btn-primary" href="customer/">
											<i class="bi bi-arrow-right me-1"></i>Weiter
										</a>
									</div>
								</div>
								<img src="img/splash.gif" class="splash img-fluid" alt="Ba Ba Bank">
							</div>
						</section>

						<section class="col-lg-5 offset-lg-1">
							<div class="surface auth-panel p-4 p-md-5 shadow-sm ms-lg-auto">
								<div class="mb-4">
									<h2 class="h4 mb-1">Anmelden</h2>
									<div class="text-secondary">Mit Passwort oder Google-Konto.</div>
								</div>
								<form id="login-form" class="d-grid gap-3">
									<div class="form-floating">
										<input name="username" type="text" class="form-control" id="usernameInput" placeholder="mustema" autocomplete="username" required>
										<label for="usernameInput">Benutzername</label>
									</div>
									<div class="form-floating">
										<input name="userpassword" type="password" class="form-control" id="userpasswordInput" placeholder="Passwort" autocomplete="current-password" required>
										<label for="userpasswordInput">Passwort</label>
									</div>
									<button id="login-submit" class="btn btn-primary btn-lg" type="submit">
										<i class="bi bi-box-arrow-in-right me-1"></i>Anmelden
									</button>
									<div id="google-login" class="is-hidden d-flex justify-content-center"></div>
									<div id="login-status" class="text-danger small" aria-live="polite"></div>
								</form>
							</div>
						</section>
					</div>
				</div>
			</main>
		</div>

		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
		<script src="app.js"></script>
	</body>
</html>
